# FluxReviews — Netlify Configuration

[build]
  # Tell Netlify where the serverless functions live
  functions = "netlify/functions"

# Route /sitemap.xml to the sitemap generator function.
# status = 200 means a rewrite (URL stays /sitemap.xml in browser).
# force = true ensures this takes priority over any static sitemap.xml file.
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200
  force  = true

# Also handle /sitemap_index.xml (some crawlers try this variant)
[[redirects]]
  from   = "/sitemap_index.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200
  force  = true

# NOTE: /movie/* SPA routing lives in _redirects (not here)
# so it is not affected by these rules.
